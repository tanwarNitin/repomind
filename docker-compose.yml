version: '3.8'

services:
  repomind:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repomind_app
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
