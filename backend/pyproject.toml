[project]
name = "repomind-backend"
version = "0.1.0"
description = "RepoMind Backend - FastAPI Server, Tree-sitter AST, LiteLLM Gateway & LangGraph Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sse-starlette>=2.0.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.22.0",
    "tree-sitter-cpp>=0.22.0",
    "rank-bm25>=0.2.2",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "litellm>=1.40.0,<1.92.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
